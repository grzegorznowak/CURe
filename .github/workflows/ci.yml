name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  detect-secrets:
    name: Detect Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: python -m pip install --upgrade detect-secrets

      - name: Scan Tracked Files
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  # PR and branch-push gate: unit tests, linters, package build, metadata check,
  # and installed-wheel smoke. Mirrors the release build job in
  # publish-package.yml so a green PR implies a buildable, installable package.
  # The wheel smoke (tests/daemon_aware_research_calls_smoke.py) writes its own
  # fake MCP chunkhound binary with short deadlines and needs no live daemon,
  # network, or secrets, so it is safe to run on every PR.
  #
  # macOS (arm64) coverage: tracked by issue #38 (indexed Codex route is
  # currently gated to Linux). The macOS leg is expected to fail until the
  # Darwin route work lands; keep fail-fast off so both legs report.
  test:
    name: Test, lint, and verify package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and test dependencies
        # Pin lint versions to the project's verified baseline (ruff 0.15.7 /
        # mypy 1.20.0, matching the local gate); unpinned "latest" ruff flags
        # pre-existing import-style violations in files this PR does not touch.
        # setuptools is required by tests that build a wheel with
        # --no-build-isolation (ambient build backend).
        run: python -m pip install --upgrade build twine pytest ruff==0.15.7 mypy==1.20.0 setuptools

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy (configured file set)
        run: python -m mypy

      - name: Run unit tests
        run: python -m pytest

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Smoke test installed wheel
        shell: bash
        run: |
          set -euo pipefail
          repo_root="$PWD"
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          python -m venv "$smoke_root/venv"
          "$smoke_root/venv/bin/python" -m pip install --upgrade pip
          "$smoke_root/venv/bin/python" -m pip install dist/*.whl
          mkdir "$smoke_root/run"
          (
            cd "$smoke_root/run"
            env -u PYTHONPATH PYTHONSAFEPATH=1 \
              "$smoke_root/venv/bin/python" \
              "$repo_root/tests/daemon_aware_research_calls_smoke.py" \
              --cure-bin "$smoke_root/venv/bin/cure"
          )
